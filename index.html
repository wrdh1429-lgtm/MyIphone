<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>آيفون</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
:root{--bg:#d9eefa}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10222c}}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:-apple-system,"SF Pro Text","Segoe UI",Tahoma,sans-serif;overflow:hidden;user-select:none}
#ph{position:relative;width:min(390px,100vw);height:min(844px,100dvh);background:#bfe6f8;border-radius:48px;overflow:hidden;box-shadow:0 0 0 10px #1c1c1e,0 20px 60px #0004;color:#000}
@media(max-width:500px){#ph{border-radius:0;box-shadow:none}}
#sb{position:absolute;top:0;left:0;right:0;height:50px;z-index:55;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-weight:600;font-size:15px;direction:ltr;pointer-events:none}
.lt #sb{color:#fff}
#isl{position:absolute;top:11px;left:50%;margin-left:-55px;width:110px;height:32px;background:#000;border-radius:20px;z-index:56}
#hb{position:absolute;bottom:0;left:0;right:0;height:30px;z-index:60;cursor:pointer}
#hb::after{content:"";position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#000;opacity:.85}
.lt #hb::after{background:#fff}
#grid{position:absolute;top:70px;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center}
.hi{text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 3px #0006;cursor:pointer}
.ic{width:60px;height:60px;border-radius:14px;overflow:hidden;margin:0 auto 5px;box-shadow:0 1px 3px #0003}.ic svg{width:100%;height:100%;display:block}
#dock{position:absolute;bottom:22px;left:14px;right:14px;height:92px;border-radius:34px;background:#ffffff55;backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}#dock .ic{margin:0}
.app{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;padding-top:50px;z-index:5}
.app.on{display:flex;animation:pop .28s ease}@keyframes pop{from{transform:scale(.6);opacity:0;border-radius:40px}}
.h1{font-size:32px;font-weight:700;padding:8px 18px}
.bar{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:17px}.bk{font-size:30px;color:#007aff;cursor:pointer;line-height:1}
.scroll{flex:1;overflow:auto;padding-bottom:40px}
#lock{position:absolute;inset:0;z-index:40;background:linear-gradient(#a9dcf5,#d8f1fc);text-align:center;padding-top:110px;cursor:pointer;transition:transform .4s}
#lock.up{transform:translateY(-100%)}#lock .d{font-size:18px;color:#1c3a4d}#lock .t{font-size:84px;font-weight:600;color:#1c3a4d}#lock small{position:absolute;bottom:50px;left:0;right:0;color:#1c3a4d99;font-size:14px}
.row{display:flex;gap:12px;padding:10px 16px;align-items:center;cursor:pointer}.rb{flex:1;min-width:0;border-bottom:1px solid #eee;padding-bottom:8px}.rt{display:flex;justify-content:space-between}.rt small{color:#8e8e93;font-size:12px}.rs{color:#8e8e93;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between}
.av{width:50px;height:50px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.bd{background:#25d366;color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.srch{margin:0 16px 6px;background:#f2f2f7;border-radius:10px;padding:8px 12px;color:#8e8e93;font-size:15px}
.tabs{display:flex;justify-content:space-around;padding:8px 0 34px;border-top:1px solid #eee;font-size:11px;color:#8e8e93;background:#f9f9f9}.tabs .a{color:#25d366}
#wc{display:none;flex-direction:column;flex:1;min-height:0;background:#efe7dd}.chat #wc{display:flex}.chat #wl{display:none}
#wc .bar{background:#f6f6f6;border-bottom:1px solid #ddd}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:7px 10px 4px;border-radius:10px;background:#fff;align-self:flex-start;font-size:16px;line-height:1.35;box-shadow:0 1px 1px #0002}
.b.me{background:#d9fdd3;align-self:flex-end}.b small{display:block;font-size:11px;color:#8e8e93;text-align:left;direction:ltr}
.voice{display:flex;align-items:center;gap:8px;min-width:210px;flex-wrap:wrap}.pl{font-size:20px;color:#8e8e93;cursor:pointer;width:24px}
.wv{display:flex;align-items:center;gap:2px;height:28px;flex:1;direction:ltr}.wv i{width:3px;background:#c4c4c4;border-radius:2px}.wv i.d{background:#25d366}
.inp{display:flex;gap:8px;padding:8px 10px 32px;background:#f6f6f6;align-items:center}.inp input{flex:1;border:1px solid #ddd;border-radius:20px;padding:9px 14px;font-size:16px;outline:0;font-family:inherit;direction:rtl}
.snd{width:38px;height:38px;border-radius:50%;background:#25d366;color:#fff;border:0;font-size:18px;cursor:pointer}
.grp{background:#fff;border-radius:12px;margin:8px 16px;overflow:hidden}.pg{background:#f2f2f7}
.ni{padding:11px 14px;border-bottom:1px solid #eee;cursor:pointer}.ni small{color:#8e8e93}
textarea{flex:1;border:0;outline:0;padding:10px 18px;font-size:18px;font-family:inherit;resize:none;direction:rtl}
.sr{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #eee;font-size:17px}.sr span{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px}.sr em{margin-right:auto;color:#8e8e93;font-style:normal}
.tg{width:48px;height:29px;border-radius:15px;background:#e5e5ea;margin-right:auto;position:relative;cursor:pointer}.tg::after{content:"";position:absolute;top:2px;right:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:.2s}.tg.on{background:#34c759}.tg.on::after{right:21px}
#pg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}#pg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
#pv{position:absolute;inset:0;background:#000;z-index:8;display:none;align-items:center;justify-content:center}#pv.on{display:flex}#pv img{max-width:100%;max-height:100%}#pv b{position:absolute;top:56px;right:16px;color:#0a84ff;font-size:17px;cursor:pointer}
#a-cam{background:#000;color:#fff}#a-cam video{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:14px}
.cb{height:170px;display:flex;align-items:center;justify-content:space-around;padding-bottom:20px}.sh{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}.th{width:44px;height:44px;border-radius:8px;background:#222 center/cover}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s;z-index:6}
.cl{position:absolute;inset:0;z-index:50;background:linear-gradient(#3b4a5a,#141a22);color:#fff;display:none;flex-direction:column;align-items:center;padding-top:120px;text-align:center}.cl.on{display:flex}
.cl h2{font-size:38px;font-weight:500}.cl p{opacity:.7;margin-top:6px;font-size:18px}
.cb2{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:space-around}.cc{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;border:0;color:#fff}
.cc small{display:block}
</style></head><body>
<div id="ph">
<div id="sb"><span id="tm"></span><span>📶 🛜 🔋</span></div><div id="isl"></div>
<div id="grid"></div><div id="dock"></div>
<section class="app" id="a-photos"></section><section class="app" id="a-wa"></section><section class="app" id="a-notes"></section><section class="app" id="a-set"></section><section class="app" id="a-cam"></section><section class="app" id="a-phone"></section>
<div id="lock"><div class="d" id="ld"></div><div class="t" id="lt"></div><small>اضغط للفتح</small></div>
<div class="cl" id="cl"></div>
<div id="hb"></div>
</div>

// settings
const S=[['✈️','#ff9f0a','وضع الطيران','t'],['🛜','#0a84ff','Wi‑Fi','غير متصل'],['🔵','#0a84ff','بلوتوث','تشغيل'],[],['🔔','#ff3b30','الإشعارات'],['🔊','#ff2d55','الصوت واللمسات'],['🌙','#5e5ce6','التركيز'],[],['⚙️','#8e8e93','عام'],['🌞','#0a84ff','العرض والسطوع'],['🔒','#8e8e93','الخصوصية والأمان']];
$('#a-set').innerHTML=`<div class="pg" style="flex:1;overflow:auto"><div class="h1">الإعدادات</div>`+'<div class="grp">'+S.map(r=>r.length?`<div class="sr"><span style="background:${r[1]}">${r[0]}</span>${r[2]}${r[3]=='t'?'<div class="tg" onclick="this.classList.toggle(\'on\')"></div>':r[3]?'<em>'+r[3]+'</em>':'<em>‹</em>'}</div>`:'</div><div class="grp">').join('')+'</div></div>';
// camera
let ms=null;
function camBox(){$('#a-cam').innerHTML=`<video id="vd" autoplay playsinline muted></video><div class="cb"><div class="th" id="th"></div><div class="sh" onclick="snap()"></div><span style="width:44px;text-align:center">صورة</span></div><div id="fl"></div>`}
async function camStart(){camBox();try{ms=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#vd').srcObject=ms}catch(e){$('#vd').poster='';$('#vd').outerHTML='<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#888;padding:30px;text-align:center" id="vd">الكاميرا غير متاحة (اسمح بالوصول للكاميرا من المتصفح)</div>'}}
function camStop(){if(ms){ms.getTracks().forEach(t=>t.stop());ms=null}}
function snap(){const f=$('#fl');f.style.opacity=1;setTimeout(()=>f.style.opacity=0,120);const v=$('#vd');if(v.videoWidth){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const u=c.toDataURL('image/jpeg',.8);IM.unshift(u);drawPhotos();$('#th').style.backgroundImage=`url(${u})`}}
// phone
const calls=[];
function phoneList(){$('#a-phone').innerHTML=`<div class="h1">الأخيرة</div><div class="scroll">${calls.length?calls.map(c=>`<div class="row"><div class="rb"><b style="${c.x?'color:#ff3b30':''}">احمد 🌊</b><div class="rs">جوال · ${c.x?'لم يتم الرد':'وارد'}</div></div></div>`).join(''):'<p style="text-align:center;color:#8e8e93;margin-top:40px">لا توجد مكالمات</p>'}</div>`}
phoneList();
// call
function tone(f,t,d){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05)}
function burst(){if(!ringing)return;try{const t=AC.currentTime;[659,880,784,988,880,1175,988,784,1319,988].forEach((f,i)=>tone(f,t+i*.14,.6))}catch(e){}try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}setTimeout(burst,2600)}
function incoming(){ringing=1;const c=$('#cl');c.innerHTML=`<p>جوال</p><h2>احمد 🌊</h2><div class="cb2"><div style="text-align:center"><button class="cc" style="background:#ff3b30" onclick="endCall(1)">📞</button><small>رفض</small></div><div style="text-align:center"><button class="cc" style="background:#34c759" onclick="answer()">📞</button><small>قبول</small></div></div>`;c.classList.add('on');ph.classList.add('lt');try{AC&&AC.resume()}catch(e){}burst()}
let ct;
function answer(){ringing=0;let s=0;const c=$('#cl');c.innerHTML=`<h2>احمد 🌊</h2><p id="ctm">00:00</p><div class="cb2"><div style="text-align:center"><button class="cc" style="background:#ff3b30" onclick="endCall()">📞</button><small>إنهاء</small></div></div>`;ct=setInterval(()=>{s++;const e=$('#ctm');if(e)e.textContent='00:'+String(s).padStart(2,'0');if(s>=10)endCall()},1000)}
function endCall(x){const was=ringing;ringing=0;clearInterval(ct);calls.unshift({x:x&&was});phoneList();const c=$('#cl');c.innerHTML='<h2>انتهت المكالمة</h2>';setTimeout(()=>{c.classList.remove('on');ph.classList.toggle('lt',cur&&cur.id=='a-cam')},1200)}
drawPhotos();waList();
</script></body></html>
